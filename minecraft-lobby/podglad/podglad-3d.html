  if (n.endsWith('campfire')) return SHAPE.campfire;
  if (n === 'water') return SHAPE.water;
  if (n === 'nether_portal') return SHAPE.portal;
  if (n === 'beacon') return SHAPE.beacon;
  return null;
}

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#7fb2e8');
scene.fog = new THREE.Fog('#9cc4ee', 90, 190);
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 600);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.62;
controls.minDistance = 12; controls.maxDistance = 140;

scene.add(new THREE.HemisphereLight('#dcecff', '#4a3b2a', 0.75));
const sun = new THREE.DirectionalLight('#fff2d6', 0.95);
sun.position.set(40, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 10, far: 200 });
scene.add(sun, sun.target);

let group = null;
const labelSprites = [];

function textSprite(text, accent) {
  const lines = text.split('\n');
  const c = document.createElement('canvas');
  const fs = 40, pad = 18, lh = fs * 1.05;
  const ctx = c.getContext('2d');
  ctx.font = `${fs}px VT323, monospace`;
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + pad * 2;
  c.width = Math.ceil(w); c.height = Math.ceil(lines.length * lh + pad * 1.6);
  ctx.font = `${fs}px VT323, monospace`;
  ctx.fillStyle = 'rgba(10,10,18,0.55)'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(l, c.width / 2 + 3, pad * 0.8 + i * lh + 3);
    ctx.fillStyle = i === 0 ? accent : (l.startsWith('»') ? '#a7ffb0' : '#e9e9e9');
    ctx.fillText(l, c.width / 2, pad * 0.8 + i * lh);
  });
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: true, transparent: true }));
  const scale = 0.032;
  s.scale.set(c.width * scale, c.height * scale, 1);
  return s;
}

function npcMesh(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.25, 0.45), new THREE.MeshLambertMaterial({ color }));
  body.position.y = 0.62; body.castShadow = true;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.62, 0.55), new THREE.MeshLambertMaterial({ color: '#c69477' }));
  head.position.y = 1.56; head.castShadow = true;
  const nose = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.26, 0.14), new THREE.MeshLambertMaterial({ color: '#a8775c' }));
  nose.position.set(0, 1.45, 0.33);
  g.add(body, head, nose);
  return g;
}

function build(key) {
  if (group) { scene.remove(group); group.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  labelSprites.length = 0;
  group = new THREE.Group();
  const data = WORLDS[key];
  const b = data.blocks, pal = data.palette;
  const buckets = pal.map(() => []);
  for (let i = 0; i < b.length; i += 4) buckets[b[i + 3]].push(i);
  const m = new THREE.Matrix4(), col = new THREE.Color();
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  pal.forEach((name, id) => {
    if (SKIP.has(name) || !buckets[id].length) return;
    const shape = shapeOf(name);
    const geo = shape ? new THREE.BoxGeometry(shape[0], shape[1], shape[2]) : new THREE.BoxGeometry(1, 1, 1);
    const base = new THREE.Color(COLORS[name] || '#999');
    const opts = { color: '#ffffff' };
    if (GLOW.has(name)) { opts.emissive = base.clone().multiplyScalar(name === 'nether_portal' ? 0.8 : 0.55); }
    if (name === 'water' || name === 'nether_portal' || name.includes('glass')) { opts.transparent = true; opts.opacity = name === 'water' ? 0.72 : 0.78; }
    const mat = new THREE.MeshLambertMaterial(opts);
    const mesh = new THREE.InstancedMesh(geo, mat, buckets[id].length);
    buckets[id].forEach((i, n) => {
      m.makeTranslation(b[i] + 0.5, b[i + 1] + 0.5 + (shape ? shape[3] : 0), b[i + 2] + 0.5);
      mesh.setMatrixAt(n, m);
      const j = name === 'water' || GLOW.has(name) ? 0 : (rnd() - 0.5) * 0.12;
      col.copy(base).offsetHSL(0, 0, j);
      mesh.setColorAt(n, col);
    });
    mesh.castShadow = !opts.transparent && !shape; mesh.receiveShadow = true;
    group.add(mesh);
  });

  if (key === 'lobby') {
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 140, 12, 1, true),
      new THREE.MeshBasicMaterial({ color: '#ffe36a', transparent: true, opacity: 0.55, depthWrite: false }));
    beam.position.set(0.5, 101 + 70, 0.5);
    group.add(beam);
  }

  for (const e of data.entities) {
    if (e.t === 'npc') {
      const n = npcMesh(e.text.includes('ANARCHIA') ? '#7a3a28' : '#3d5e7a');
      n.position.set(e.x, e.y, e.z);
      n.rotation.y = Math.atan2(0.5 - e.x, 7.5 - e.z);
      group.add(n);
      const tag = textSprite(e.text, e.text.includes('ANARCHIA') ? '#ff5a4a' : '#4fd8e6');
      tag.position.set(e.x, e.y + 2.6, e.z); tag.scale.multiplyScalar(0.6);
      group.add(tag); labelSprites.push(tag);
    } else {
      const accent = e.text.startsWith('ANARCHIA') ? '#ff5a4a' : e.text.startsWith('FFA') ? '#4fd8e6' : '#ffb400';
      const s = textSprite(e.text, accent);
      s.position.set(e.x, e.y + 1.2, e.z);
      group.add(s); labelSprites.push(s);
    }
  }
  labelSprites.forEach(s => s.visible = document.getElementById('labels').checked);
  scene.add(group);

  if (key === 'lobby') { camera.position.set(10, 146, 44); controls.target.set(0, 100, -6); }
  else { camera.position.set(38, 132, 46); controls.target.set(0, 100, 0); }
  controls.update();
  legend(key);
}

function legend(key) {
  const items = key === 'lobby' ? [
    ['#ffb400', 'Spawn + fontanna z beaconem'], ['#ff5a4a', '« Pawilon Anarchii (portal)'], ['#4fd8e6', 'Pawilon FFA (brama) »'],
    ['#f6d03e', 'Wyrzutnie'], ['#f1b5cf', 'Wiśnie i kwiaty']
  ] : [
    ['#5f9c3a', 'Arena (promień 30)'], ['#7b7b7b', 'Mur + niewidzialna bariera'], ['#888a8a', 'Głazy i ruiny jako osłony'], ['#ffb400', '8 spawnów dookoła']
  ];
  document.getElementById('legend').innerHTML = items.map(([c, t]) => `<span><span class="dot" style="background:${c}"></span>${t}</span>`).join('') +
    '<span class="hint">przeciągnij: obrót · kółko/szczypanie: zoom</span>';
}

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

const tabs = { lobby: document.getElementById('tLobby'), ffa: document.getElementById('tFfa') };
for (const [k, el] of Object.entries(tabs)) el.addEventListener('click', () => {
  for (const [k2, e2] of Object.entries(tabs)) e2.setAttribute('aria-pressed', String(k2 === k));
  build(k);
});
document.getElementById('labels').addEventListener('change', e => labelSprites.forEach(s => s.visible = e.target.checked));
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const spin = document.getElementById('spin');
if (reduce) spin.checked = false;
controls.addEventListener('start', () => { spin.checked = false; });

function start() {
  resize(); build('lobby');
  document.getElementById('loading').remove();
  (function loop() {
    controls.autoRotate = spin.checked; controls.autoRotateSpeed = 0.6;
    controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
  })();
}
(document.fonts && document.fonts.load ? document.fonts.load('40px VT323') : Promise.resolve()).catch(() => {}).finally(start);
</script>
