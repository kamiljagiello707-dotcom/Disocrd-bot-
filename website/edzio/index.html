<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edzio · e-dziennik</title>
<meta name="description" content="Edzio: nowoczesny dziennik elektroniczny dla uczniów, rodziców, nauczycieli i dyrekcji.">
<meta name="theme-color" content="#5b5bf7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b5bf7'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M42 20H24v24h18M24 32h14' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4fa;--sf:#ffffff;--sf2:#f7f8fc;--ink:#0f1222;--mute:#5d6478;--dim:#99a0b3;--line:#e6e8f1;
  --br:#5b5bf7;--br2:#a855f7;--brs:rgba(91,91,247,.1);--grad:linear-gradient(135deg,#5b5bf7,#a855f7);
  --ok:#16a34a;--bad:#e11d48;--warn:#f59e0b;--info:#2563eb;
  --sh:0 1px 2px rgba(16,24,40,.04),0 10px 30px -14px rgba(16,24,40,.14);--sh2:0 24px 60px -20px rgba(16,24,40,.35);
  --r:18px;--ease:cubic-bezier(.2,.8,.2,1);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0d18;--sf:#121628;--sf2:#171c31;--ink:#e9ecf7;--mute:#9ba3bc;--dim:#5f6882;--line:#242a43;--brs:rgba(124,124,255,.15);--sh:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a0d18;--sf:#121628;--sf2:#171c31;--ink:#e9ecf7;--mute:#9ba3bc;--dim:#5f6882;--line:#242a43;--brs:rgba(124,124,255,.15);--sh:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--br);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── logowanie ── */
.login{min-height:100svh;display:grid;grid-template-columns:1.05fr .95fr}
.lg-art{position:relative;overflow:hidden;background:#0d0b2a;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.lg-art .bl{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:blob 14s ease-in-out infinite}
.lg-art .b1{width:420px;height:420px;background:#5b5bf7;left:-80px;top:-60px}
.lg-art .b2{width:360px;height:360px;background:#a855f7;right:-60px;top:30%;animation-delay:-4s}
.lg-art .b3{width:300px;height:300px;background:#22d3ee;left:20%;bottom:-120px;animation-delay:-8s;opacity:.45}
@keyframes blob{33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,40px) scale(.94)}}
.lg-art>*{position:relative;z-index:1}
.lg-logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px}
.mk{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 8px 24px -6px rgba(91,91,247,.6)}
.lg-art h1{font-size:clamp(38px,4.6vw,64px);line-height:1.02;letter-spacing:-.04em;font-weight:800;max-width:560px}
.lg-art h1 span{background:linear-gradient(90deg,#c7c7ff,#f0abfc,#a5f3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-art p{color:rgba(255,255,255,.72);max-width:460px;margin-top:18px;font-size:17px}
.fc{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.fc span{padding:9px 14px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:13px;font-weight:600;backdrop-filter:blur(8px)}
.mock{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px}
.mock div{border-radius:16px;padding:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);animation:fl 6s ease-in-out infinite}
.mock div:nth-child(2){animation-delay:-2s}.mock div:nth-child(3){animation-delay:-4s}
.mock b{font-size:26px;display:block}.mock small{color:rgba(255,255,255,.6);font-size:12px}
@keyframes fl{50%{transform:translateY(-8px)}}
.lg-form{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(20px,6vw,80px);background:var(--sf)}
.lg-form h2{font-size:30px;letter-spacing:-.03em;font-weight:800}
.lg-form>p{color:var(--mute);margin:8px 0 26px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{position:relative;text-align:left;padding:18px;border-radius:18px;border:1.5px solid var(--line);background:var(--sf);transition:.3s var(--ease);opacity:0;transform:translateY(16px);animation:up .6s var(--ease) forwards;animation-delay:calc(var(--i)*.07s + .1s)}
.role:hover{border-color:var(--br);transform:translateY(-3px);box-shadow:var(--sh)}
.role .ri{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px;color:#fff}
.role b{display:block;font-size:16px}
.role small{color:var(--mute);font-size:13px;display:block;margin-top:2px}
.role .who{font-size:12px;color:var(--dim);margin-top:10px;font-weight:600}
@keyframes up{to{opacity:1;transform:none}}
.lg-note{margin-top:22px;padding:14px 16px;border-radius:14px;background:var(--brs);color:var(--mute);font-size:13px;display:flex;gap:10px}
.lg-note .ic{color:var(--br);width:18px;height:18px;margin-top:1px}
@media (max-width:900px){.login{grid-template-columns:1fr}.lg-art{padding:28px 20px 32px;min-height:auto;gap:28px}.mock{display:none}.lg-form{padding:28px 16px 40px}}
@media (max-width:420px){.roles{grid-template-columns:1fr}}

/* ── powłoka ── */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100svh}
.side{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;padding:20px 14px;background:var(--sf);border-right:1px solid var(--line);z-index:40}
.side .lg-logo{padding:4px 8px 18px;font-size:20px}
.side .lg-logo small{display:block;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.02em}
.nv{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px}
.nv a{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mute);font-weight:600;font-size:14px;transition:background .2s,color .2s}
.nv a:hover{background:var(--sf2);color:var(--ink)}
.nv a.on{background:var(--brs);color:var(--br)}
.nv a.on::before{content:"";position:absolute;left:-4px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--grad)}
.nv .bd{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.nv .sec{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--dim);padding:16px 12px 6px;text-transform:uppercase}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:1px solid var(--line);margin-top:12px}
.me b{font-size:14px;display:block;line-height:1.2}
.me small{font-size:12px;color:var(--mute)}
.me button{margin-left:auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.me button:hover{background:var(--sf2);color:var(--bad)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;letter-spacing:.02em}
.av.sm{width:30px;height:30px;border-radius:10px;font-size:11px}
.av.lg{width:56px;height:56px;border-radius:18px;font-size:18px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.top.sc{border-color:var(--line)}
.top h1{font-size:22px;letter-spacing:-.03em;font-weight:800;line-height:1.1}
.top h1 small{display:block;font-size:12px;color:var(--mute);font-weight:600;letter-spacing:0}
.tb{display:flex;gap:8px;margin-left:auto;align-items:center}
.ib{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--sf);border:1px solid var(--line);color:var(--mute);transition:.2s}
.ib:hover{color:var(--ink);border-color:var(--dim)}
.ib .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--sf)}
.srch{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px 0 14px;border-radius:12px;background:var(--sf);border:1px solid var(--line);color:var(--dim);font-size:14px;min-width:240px;transition:.2s}
.srch:hover{border-color:var(--dim)}
.srch kbd{margin-left:auto;font-family:inherit;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--mute)}
.burger{display:none}
.content{padding:8px 28px 48px;max-width:1320px;width:100%}
.pg{animation:pg .45s var(--ease)}
@keyframes pg{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.scrim{display:none}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-102%);transition:transform .4s var(--ease);box-shadow:var(--sh2)}
  .side.on{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(10,12,24,.45);z-index:35;opacity:0;visibility:hidden;transition:.3s}
  .scrim.on{opacity:1;visibility:visible}
  .burger{display:grid}
  .srch{min-width:0;width:42px;padding:0;justify-content:center}.srch span,.srch kbd{display:none}
  .top{padding:12px 16px}.content{padding:6px 16px 40px}
  .top h1{font-size:19px}
}

/* ── elementy ── */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g21,.g12{grid-template-columns:1fr}}
@media (max-width:640px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr;gap:10px}.g4 .stat{padding:14px}.g4 .stat .si{width:36px;height:36px;margin-bottom:10px}.g4 .stat b{font-size:24px}.g4 .stat small{display:none}.g3{gap:10px}}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.ch h3{font-size:16px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.ch h3 .ic{color:var(--br)}
.ch a,.lnk{font-size:13px;font-weight:700;color:var(--br)}
.stat{position:relative;overflow:hidden}
.stat .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:16px}
.stat span{font-size:13px;color:var(--mute);font-weight:600}
.stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--dim);font-weight:600}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c,var(--br));opacity:.07}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 26px;color:#fff;background:var(--grad);box-shadow:0 20px 50px -24px rgba(91,91,247,.8)}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::after{content:"";position:absolute;right:120px;bottom:-120px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:clamp(22px,2.6vw,30px);letter-spacing:-.03em;font-weight:800}
.hero p{opacity:.85;margin-top:4px}
.live{margin-top:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px)}
.live b{font-size:17px}
.live small{opacity:.85}
.pbar{flex:1;min-width:160px;height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.pbar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width 1s var(--ease)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--grad);color:#fff;transition:.2s var(--ease);white-space:nowrap;box-shadow:0 8px 20px -10px rgba(91,91,247,.8)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.gh{background:var(--sf);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.gh:hover{border-color:var(--dim)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.ok{background:var(--ok);box-shadow:none}.btn.bad{background:var(--bad);box-shadow:none}
.btn .ic{width:18px;height:18px}
.btn[disabled]{opacity:.5;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sf2);color:var(--mute);white-space:nowrap}
.pill.ok{background:rgba(22,163,74,.12);color:var(--ok)}.pill.bad{background:rgba(225,29,72,.12);color:var(--bad)}.pill.warn{background:rgba(245,158,11,.14);color:#b45309}.pill.info{background:rgba(37,99,235,.12);color:var(--info)}.pill.br{background:var(--brs);color:var(--br)}
[data-theme=dark] .pill.warn{color:#fbbf24}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--sf2);border:1px solid var(--line);flex-wrap:wrap}
.tabs button{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;color:var(--mute);transition:.2s}
.tabs button.on{background:var(--sf);color:var(--ink);box-shadow:var(--sh)}
.fl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.mt{margin-top:16px}.mt2{margin-top:24px}
.mute{color:var(--mute)}.dim{color:var(--dim)}
.sel,.inp{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--sf);padding:0 12px;font-size:14px;outline:0;transition:border-color .2s;min-width:0}
.sel:focus,.inp:focus,textarea.inp:focus{border-color:var(--br)}
textarea.inp{height:auto;padding:12px;resize:vertical;width:100%}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700}
.field .inp,.field .sel{width:100%}
.empty{padding:30px 10px;text-align:center;color:var(--dim);font-size:14px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{min-width:0;flex:1}
.li .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--mute);font-size:12px}
.sdot{width:10px;height:10px;border-radius:50%;flex:none}
.num{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--sf2);color:var(--mute);flex:none}
.li.now{background:var(--brs);border-radius:12px;padding-left:10px;padding-right:10px;border-color:transparent}
.li.now .num{background:var(--grad);color:#fff}
.li.past{opacity:.55}

/* oceny */
.g{--c:#94a3b8;display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 8px;border-radius:9px;font-weight:800;font-size:13px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);transition:transform .2s var(--ease);cursor:pointer;border:1px solid color-mix(in srgb,var(--c) 25%,transparent)}
.g:hover{transform:translateY(-2px) scale(1.06)}
.g.gr6{--c:#059669}.g.gr5{--c:#16a34a}.g.gr4{--c:#0284c7}.g.gr3{--c:#d97706}.g.gr2{--c:#ea580c}.g.gr1{--c:#e11d48}
[data-theme=dark] .g.gr6{--c:#34d399}[data-theme=dark] .g.gr5{--c:#4ade80}[data-theme=dark] .g.gr4{--c:#38bdf8}[data-theme=dark] .g.gr3{--c:#fbbf24}[data-theme=dark] .g.gr2{--c:#fb923c}[data-theme=dark] .g.gr1{--c:#fb7185}
.gs{display:flex;flex-wrap:wrap;gap:6px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:700;color:var(--dim);padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer;transition:background .2s}
.tbl tr.click:hover td{background:var(--sf2)}
.tw{overflow-x:auto;margin:0 -20px;padding:0 20px}
.sub{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.sub i{width:10px;height:10px;border-radius:4px;flex:none}
.avg{font-weight:800;font-variant-numeric:tabular-nums}
/* siatka nauczyciela */
.gg{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.gg th,.gg td{padding:6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.gg th{font-size:11px;color:var(--mute);font-weight:700;vertical-align:bottom;cursor:pointer}
.gg th small{display:block;color:var(--dim);font-weight:600}
.gg th .w{display:inline-block;margin-top:3px;padding:1px 6px;border-radius:6px;background:var(--sf2);font-size:10px}
.gg .st{position:sticky;left:0;background:var(--sf);text-align:left;z-index:1;min-width:200px;box-shadow:1px 0 0 var(--line)}
.gg td.cell{cursor:pointer;min-width:52px;transition:background .2s}
.gg td.cell:hover{background:var(--brs)}
.gg td.cell .add{color:var(--dim);opacity:0;font-weight:700;transition:.2s}
.gg td.cell:hover .add{opacity:1}
.gg tr.foot td{font-weight:800;background:var(--sf2)}
.gg .flash{animation:flash 1s var(--ease)}
@keyframes flash{from{background:color-mix(in srgb,var(--br) 30%,transparent)}}
/* popover */
.pop{position:fixed;z-index:120;background:var(--sf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);padding:12px;width:248px;animation:popin .2s var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.pop .pg6{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pop .g{width:100%}
.pop h5{font-size:12px;color:var(--mute);margin-bottom:8px}

/* frekwencja */
.att{display:inline-grid;place-items:center;min-width:28px;height:26px;padding:0 6px;border-radius:8px;font-size:11px;font-weight:800}

.seg button{min-width:38px;height:34px;padding:0 8px;border-radius:10px;font-size:12px;font-weight:800;border:1px solid var(--line);color:var(--mute);transition:.15s}
.seg button:hover{border-color:var(--dim)}
.seg button.on.a-ob{background:var(--ok);color:#fff;border-color:var(--ok)}
.seg button.on.a-nb{background:var(--bad);color:#fff;border-color:var(--bad)}
.seg button.on.a-u{background:var(--info);color:#fff;border-color:var(--info)}
.seg button.on.a-sp{background:var(--warn);color:#fff;border-color:var(--warn)}
.seg button.on.a-zw{background:var(--mute);color:#fff;border-color:var(--mute)}
.seg button:not(.on){background:transparent}
/* kalendarz */

.cal .d:hover{border-color:var(--dim)}
.cal .d.out{opacity:.4}
.cal .d.we{background:var(--sf2)}
.cal .d.today .n{background:var(--grad);color:#fff}
.cal .d.sel{border-color:var(--br);box-shadow:0 0 0 3px var(--brs)}
.cal .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800}
.cal .ev{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.cal .more{font-size:11px;color:var(--dim);font-weight:700}
.cal .dots{display:none;gap:3px;flex-wrap:wrap}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}

.mcal .d{min-height:46px;align-items:center;justify-content:center;gap:3px}
.mcal .d .dots{display:flex}
/* plan */
.plan{display:grid;grid-template-columns:70px repeat(5,minmax(130px,1fr));gap:6px;min-width:720px}
.plan .h{font-size:12px;font-weight:700;color:var(--mute);text-align:center;padding:8px 4px;border-radius:12px}
.plan .h b{display:block;color:var(--ink);font-size:14px}
.plan .h.today{background:var(--brs);color:var(--br)}.plan .h.today b{color:var(--br)}
.plan .tm{font-size:11px;color:var(--dim);font-weight:700;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.plan .tm b{font-size:16px;color:var(--mute)}
.plan .c{border-radius:12px;padding:10px;min-height:68px;background:color-mix(in srgb,var(--c) 11%,var(--sf));border-left:3px solid var(--c);font-size:12px;transition:.2s}
.plan .c:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.plan .c b{display:block;font-size:13px;color:var(--ink)}
.plan .c span{color:var(--mute)}
.plan .c.now{box-shadow:0 0 0 2px var(--c);animation:nowp 2s infinite}
@keyframes nowp{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent)}}
.plan .e{border-radius:12px;border:1px dashed var(--line);min-height:68px}

.msg{display:grid;grid-template-columns:360px 1fr;gap:0;padding:0;overflow:hidden;min-height:560px}
.ml{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ml .hd{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ml .its{overflow-y:auto;max-height:620px}

.mi:hover{background:var(--sf2)}
.mi.on{background:var(--brs)}
.mi .t{min-width:0;flex:1}
.mi .t b{font-size:14px;display:flex;justify-content:space-between;gap:8px}
.mi .t b small{font-weight:600;color:var(--dim);font-size:11px;white-space:nowrap}
.mi .t .s{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .t .p{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.unr::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--br)}
.mr{padding:26px;min-width:0}
.mr h2{font-size:22px;letter-spacing:-.02em}

.mr .body{white-space:pre-wrap;line-height:1.75}
.mr .bk{display:none}
@media (max-width:900px){.mr .bk{display:inline-flex}.msg{grid-template-columns:1fr}.msg.reading .ml{display:none}.msg:not(.reading) .mr{display:none}}

.ann h4{font-size:17px;letter-spacing:-.01em}
.ann p{color:var(--mute);margin-top:6px;white-space:pre-wrap}
.ann .fl{margin-top:12px;font-size:12px;color:var(--dim)}

.bars .b small{font-size:11px;font-weight:700;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@keyframes grow{from{height:0}}
.donut{position:relative;width:170px;height:170px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:16;animation:dn 1.2s var(--ease) both}
@keyframes dn{from{stroke-dasharray:0 1000}}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{font-size:30px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1}
.donut .c small{font-size:12px;color:var(--mute);font-weight:600}

.leg div b{margin-left:auto;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--c,var(--grad));animation:grow2 1s var(--ease) both}

.ov{position:fixed;inset:0;z-index:100;background:rgba(10,12,24,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}

.md.wide{width:min(760px,100%)}

.md .mh h3{font-size:19px;letter-spacing:-.02em}
.md .mb{padding:18px 22px}
.md .mf{display:flex;justify-content:flex-end;gap:10px;padding:0 22px 22px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;z-index:200;transform:translate(-50%,20px);opacity:0;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;box-shadow:var(--sh2);transition:.35s var(--ease);pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .ic{color:#4ade80}
.pal{position:fixed;inset:0;z-index:150;background:rgba(10,12,24,.45);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fade .2s}
.pal .bx{width:min(580px,100%);background:var(--sf);border-radius:20px;box-shadow:var(--sh2);border:1px solid var(--line);overflow:hidden;animation:mdin .3s var(--ease)}
.pal input{width:100%;height:58px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 20px;font-size:16px;outline:0}
.pal .rs{max-height:52vh;overflow-y:auto;padding:8px}
.pal .r{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;text-align:left;font-size:14px;font-weight:600}
.pal .r small{margin-left:auto;color:var(--dim);font-size:12px}
.pal .r.on{background:var(--brs);color:var(--br)}
.dd{position:absolute;right:0;top:50px;width:340px;background:var(--sf);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh2);padding:8px;z-index:60;animation:popin .2s var(--ease)}
.dd h5{font-size:13px;padding:10px 12px 6px}
.dd .li{padding:10px 12px;border-radius:12px;border:0}
.dd .li:hover{background:var(--sf2)}
@media (max-width:500px){.dd{position:fixed;left:12px;right:12px;width:auto;top:64px}}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--br)}
.done .t b{text-decoration:line-through;color:var(--dim)}
.cbx{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.2s;color:#fff}
.cbx .ic{width:14px;height:14px;opacity:0}
.cbx.on{background:var(--ok);border-color:var(--ok)}.cbx.on .ic{opacity:1}
.kpi{display:flex;gap:6px;align-items:baseline}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  <div class="grid g21 mt"><div class="card"><div class="ch"><h3>${ic('trend')}Średnie wg przedmiotów</h3></div>${bars(subAvg.map(x => ({ l: SM[x.sub].n, s: SM[x.sub].s.slice(0, 7), v: x.a, t: fA(x.a), c: SM[x.sub].c })), 6)}</div>
  <div class="card"><div class="ch"><h3>${ic('journal')}Uzupełnianie dziennika</h3></div><div class="list">${tStats.map(x => `<div class="li" style="display:grid;grid-template-columns:auto 1fr auto;gap:10px">${av(x.t.id, 'sm')}<div class="t"><b>${esc(x.t.first)} ${esc(x.t.last)}</b><div class="meter mt" style="margin-top:6px"><i style="width:${x.p}%;--c:${x.p < 90 ? 'var(--warn)' : 'var(--ok)'}"></i></div></div><b style="font-size:13px">${x.p.toFixed(0)}%</b></div>`).join('')}</div></div></div>
  <div class="grid g2 mt">${D.classes.map(c => { const s2 = studentsOf(c.id), a = s2.map(s => overall(s.id)).filter(x => x != null), at = s2.reduce((x, s) => x + attStats(attOf(s.id)).pct, 0) / s2.length; return `<div class="card"><div class="ch"><h3>${ic('users')}Klasa ${c.id}</h3><a href="#/klasa" data-a="goClass" data-v="${c.id}">Szczegóły</a></div><div class="fl" style="gap:24px"><div><span class="mute" style="font-size:13px">Średnia</span><b style="display:block;font-size:26px">${fA(a.reduce((x, y) => x + y, 0) / a.length)}</b></div><div><span class="mute" style="font-size:13px">Frekwencja</span><b style="display:block;font-size:26px">${at.toFixed(1).replace('.', ',')}%</b></div><div><span class="mute" style="font-size:13px">Wychowawca</span><b style="display:block">${esc(nameOf(c.wych))}</b></div></div></div>`; }).join('')}</div>`;
}
function pTeachers() {
  return `<div class="card"><div class="ch"><h3>${ic('brief')}Kadra nauczycielska</h3></div><div class="tw"><table class="tbl"><thead><tr><th>Nauczyciel</th><th>Przedmioty</th><th>Klasy</th><th>Wychowawstwo</th><th>Lekcji / tydz.</th><th></th></tr></thead><tbody>${D.teachers.map(t => `<tr><td><div class="fl" style="flex-wrap:nowrap">${av(t.id, 'sm')}<b>${esc(t.first)} ${esc(t.last)}</b></div></td><td><div class="fl" style="gap:6px">${t.subs.map(s => `<span class="pill" style="background:color-mix(in srgb,${SM[s].c} 14%,transparent);color:${SM[s].c}">${SM[s].n}</span>`).join('')}</div></td><td>${tClasses(t.id).join(', ')}</td><td>${t.wych ? `<span class="pill br">${t.wych}</span>` : '<span class="dim">—</span>'}</td><td><b>${D.classes.reduce((a, c) => a + D.tt[c.id].flat().filter(s => D.subT[s] === t.id).length, 0)}</b></td><td><button class="btn gh sm" data-a="msgTo" data-v="${t.id}">${ic('mail')}</button></td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ═══════════ render ═══════════ */
function render() {
  closePop();
  const root = $('#root');
  if (!S || !user(S.id)) { S = null; root.innerHTML = loginView(); return; }
  const p = route(), r = S.role;
  const P = {
    pulpit: r === 'nauczyciel' ? pTeacherHome : r === 'dyrektor' ? pDirectorHome : pStudentHome,
    oceny: pGrades, frekwencja: pAttendance, plan: pPlan, terminarz: pCalendar, zadania: pHomework, uwagi: pNotes,
    wiadomosci: pMessages, ogloszenia: pAnn, dziennik: pJournal, ocenianie: pGrading, klasa: pClass, nauczyciele: pTeachers,
  };
  root.innerHTML = shell(p, P[p]());
  document.title = `${PAGES[p][0]} · ${CONF.app}`;
  countUp(); onScroll();
}
function rerender() { const y = scrollY, gw = $('#gw')?.scrollLeft; render(); scrollTo(0, y); if (gw != null && $('#gw')) $('#gw').scrollLeft = gw; }
function countUp() {
  if (reduce) return;
  $$('[data-cnt]').forEach(el => {
    const to = parseFloat(el.dataset.cnt), txt = el.textContent, dec = (el.dataset.cnt.split('.')[1] || '').length, suf = txt.endsWith('%') ? '%' : '', comma = txt.includes(',');
    const t0 = performance.now(); (function f(now) { const p = Math.min(1, (now - t0) / 900), v = to * (1 - Math.pow(1 - p, 3)); el.textContent = (dec ? v.toFixed(dec) : Math.round(v)).toString().replace('.', comma || dec ? ',' : '.') + suf; if (p < 1) requestAnimationFrame(f); else el.textContent = txt; })(t0);
  });
}
function onScroll() { $('#top')?.classList.toggle('sc', scrollY > 8); }
addEventListener('scroll', onScroll, { passive: true });
addEventListener('hashchange', () => { $('#side')?.classList.remove('on'); render(); scrollTo(0, 0); });
setInterval(() => { const l = $('#live'); if (l && S && (S.role === 'uczen' || S.role === 'rodzic')) l.innerHTML = liveCard(lessonsOn(student(viewSid()).cls, TODAY)); }, 30000);

/* motyw */
const th = localStorage.getItem('edzio-theme'); document.documentElement.dataset.theme = th || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

/* ═══════════ akcje ═══════════ */
const A = {
  login(el) { S = { role: el.dataset.r, id: el.dataset.v }; store.set('edzio-session', S); location.hash = '#/pulpit'; render(); toast(`Zalogowano: ${nameOf(S.id)}`); },
  logout() { S = null; store.set('edzio-session', null); history.replaceState(null, '', location.pathname); render(); },
  menu() { $('#side').classList.toggle('on'); $('#scrim').classList.toggle('on'); },
  theme() { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('edzio-theme', t); } catch {} rerender(); },
  closeModal, palette,
  notif(el) {
    if ($('#dd')) return closePop(); closePop();
    const n = notifs(), d = document.createElement('div'); d.className = 'dd'; d.id = 'dd';
    d.innerHTML = `<h5>Powiadomienia</h5>${n.map(x => `<a class="li" href="#/${x.p}"><span class="num" style="color:${x.c}">${ic(x.i)}</span><div class="t"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></div></a>`).join('') || '<div class="empty">Wszystko przeczytane ✨</div>'}`;
    el.parentElement.appendChild(d);
  },
  grade(el) { gradeModal(el.dataset.v); },
  oView(el) { U.oView = el.dataset.v; rerender(); },
  calNav(el) { const d = pd(U.cal); d.setMonth(d.getMonth() + +el.dataset.v); U.cal = ds(d); rerender(); },
  calToday() { U.cal = TODAY.slice(0, 8) + '01'; U.calSel = TODAY; U.pDay = TODAY; rerender(); },
  calSel(el) { U.calSel = U.pDay = el.dataset.v; rerender(); },
  week(el) { U.week = +el.dataset.v === 0 ? 0 : U.week + +el.dataset.v; rerender(); },
  hwTab(el) { U.hw = el.dataset.v; rerender(); },
  hwTick(el) { const sid = viewSid(), h = D.hw[sid] = D.hw[sid] || {}; h[el.dataset.v] ? delete h[el.dataset.v] : h[el.dataset.v] = 1; save(); if (h[el.dataset.v]) toast('Zadanie oznaczone jako zrobione'); rerender(); },
  uTab(el) { U.uTab = el.dataset.v; rerender(); },
  mTab(el) { U.mTab = el.dataset.v; U.mSel = null; rerender(); },
  mOpen(el) { U.mSel = el.dataset.v; rerender(); },
  mBack() { U.mSel = null; rerender(); },
  compose() { composeModal(); },
  msgTo(el) { closeModal(); composeModal(el.dataset.v); },
  reply(el) { const m = D.msgs.find(x => x.id === el.dataset.v); composeModal(m.from, m.subj.startsWith('Re: ') ? m.subj : 'Re: ' + m.subj, `\n\n— ${nameOf(m.from)} napisał(a):\n${m.body.split('\n').map(l => '> ' + l).join('\n')}`); },
  send() {
    const to = $('#cTo').value, su = $('#cSu').value.trim(), bo = $('#cBo').value.trim();
    if (!su || !bo) return toast('Uzupełnij temat i treść');
    let ids = [to];
    if (to === 'g:t') ids = D.teachers.map(t => t.id); else if (to.startsWith('g:s:')) ids = studentsOf(to.slice(4)).map(s => s.id); else if (to.startsWith('g:p:')) ids = studentsOf(to.slice(4)).map(s => s.parent);
    D.msgs.push({ id: uid(), from: S.id, to: ids, subj: su, body: bo, date: TODAY, r: {} }); save(); closeModal(); U.mTab = 'out'; toast('Wiadomość wysłana'); if (route() === 'wiadomosci') rerender();
  },
  justNew: justModal,
  justSend() {
    const dates = $$('input[name=jd]:checked').map(i => i.value), r = $('#jr').value.trim();
    if (!dates.length) return toast('Zaznacz co najmniej jeden dzień'); if (!r) return toast('Podaj powód nieobecności');
    D.just.push({ id: uid(), sid: viewSid(), by: S.id, dates, reason: r, status: 'pending', date: TODAY }); save(); closeModal(); toast('Wniosek wysłany do wychowawcy'); rerender();
  },
  justOk(el) { const j = D.just.find(x => x.id === el.dataset.v), s = student(j.sid); j.status = 'ok'; j.dates.forEach(d => Object.keys(D.logs).filter(k => k.startsWith(d + '|' + s.cls + '|')).forEach(k => { if (D.logs[k].a[j.sid] === 'nb') D.logs[k].a[j.sid] = 'u'; })); save(); toast('Usprawiedliwienie przyjęte'); rerender(); },
  justNo(el) { D.just.find(x => x.id === el.dataset.v).status = 'no'; save(); toast('Usprawiedliwienie odrzucone'); rerender(); },
  openLesson(el) { const [d] = el.dataset.v.split('|'); U.dDate = d; U.dKey = el.dataset.v; U.draft = null; go('dziennik'); },
  pickLesson(el) { U.dKey = el.dataset.v; U.draft = null; rerender(); },
  dDay(el) { let d = U.dDate; do { d = addD(d, +el.dataset.v); } while (!isSchool(d)); U.dDate = d; U.dKey = null; U.draft = null; rerender(); },
  setAtt(el) {
    const seg = el.closest('.seg'), sid = seg.dataset.sid, v = el.dataset.v;
    if (v === 'ob') delete U.draft.a[sid]; else U.draft.a[sid] = v;
    $$('button', seg).forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    updCnt();
  },
  allPresent() { U.draft.a = {}; $$('.seg').forEach(seg => $$('button', seg).forEach(b => { const on = b.dataset.v === 'ob'; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); })); updCnt(); },
  saveLesson() {
    const L = tLessonsOn(S.id, U.dDate).find(l => l.key === U.dKey); if (!L) return;
    const t = $('#dTopic').value.trim(); if (!t) { $('#dTopic').focus(); return toast('Wpisz temat lekcji'); }
    D.logs[L.key] = { s: L.sub, t, a: { ...U.draft.a } }; save(); toast('Lekcja zapisana');
    const next = tLessonsOn(S.id, U.dDate).find(l => !l.log && lessonState(U.dDate, l.n) !== 'future'); if (next) { U.dKey = next.key; U.draft = null; } rerender();
  },
  cell(el) {
    const c = D.cols.find(x => x.id === el.dataset.c), sid = el.dataset.s, cur = c.g[sid];
    const p = pop(el, `<h5>${esc(nameOf(sid))} · ${esc(c.cat)}</h5><div class="pg6">${GRADES.map(g => `<button class="g ${gcls(g)}${g === cur ? ' on' : ''}" data-a="setGrade" data-v="${esc(g)}" style="${g === cur ? 'outline:2px solid var(--br)' : ''}">${esc(g)}</button>`).join('')}</div>${cur != null ? `<button class="btn gh sm mt" style="width:100%" data-a="setGrade" data-v="">${ic('trash')}Usuń ocenę</button>` : ''}`);
    p.dataset.c = c.id; p.dataset.s = sid;
  },
  setGrade(el) {
    const p = $('#pop'), c = D.cols.find(x => x.id === p.dataset.c), sid = p.dataset.s, v = el.dataset.v;
    if (v) c.g[sid] = v; else delete c.g[sid]; save(); closePop(); rerender();
    const cell = $(`td[data-c="${c.id}"][data-s="${sid}"]`); if (cell) cell.classList.add('flash');
    toast(v ? `Ocena ${v}: ${nameOf(sid)}` : 'Ocena usunięta');
  },
  colNew() { colModal(null); },
  colEdit(el) { colModal(D.cols.find(c => c.id === el.dataset.v)); },
  colSave(el) {
    const cat = $('#kCat').value, w = clamp(+$('#kW').value || 1, 1, 5), date = $('#kD').value || TODAY, desc = $('#kDesc').value.trim();
    if (el.dataset.v) Object.assign(D.cols.find(c => c.id === el.dataset.v), { cat, w, date, desc });
    else D.cols.push({ id: uid(), cls: U.oCls, sub: U.oSub, cat, w, date, desc, g: {} });
    save(); closeModal(); toast('Kolumna zapisana'); rerender();
    if (!el.dataset.v) setTimeout(() => { const g = $('#gw'); if (g) g.scrollLeft = g.scrollWidth; }, 50);
  },
  colDel(el) { const c = D.cols.find(x => x.id === el.dataset.v); if (Object.keys(c.g).length && !confirm('Kolumna zawiera oceny. Usunąć ją razem z ocenami?')) return; D.cols = D.cols.filter(x => x !== c); save(); closeModal(); toast('Kolumna usunięta'); rerender(); },
  evNew: evModal,
  evSave() {
    const t = $('#eTi').value.trim(); if (!t) return toast('Podaj tytuł');
    const e = { id: uid(), type: $('#eT').value, date: $('#eD').value || TODAY, cls: $('#eC').value, sub: $('#eS').value || null, title: t, desc: $('#eDe').value.trim(), by: S.id };
    D.events.push(e); save(); closeModal(); U.calSel = e.date; U.cal = e.date.slice(0, 8) + '01'; toast('Wydarzenie dodane'); rerender();
  },
  delEv(el) { D.events = D.events.filter(e => e.id !== el.dataset.v); save(); toast('Wydarzenie usunięte'); rerender(); },
  noteNew: noteModal,
  noteSave() { const x = $('#nX').value.trim(); if (!x) return toast('Wpisz treść uwagi'); D.notes.push({ id: uid(), sid: $('#nS').value, by: S.id, date: TODAY, type: $('#nT .on').dataset.v, text: x }); save(); closeModal(); toast('Uwaga dodana'); rerender(); },
  annNew: annModal,
  annSave() { const t = $('#aT').value.trim(), b = $('#aB').value.trim(); if (!t || !b) return toast('Uzupełnij tytuł i treść'); D.ann.push({ id: uid(), title: t, body: b, by: S.id, date: TODAY, target: $('#aG').value }); save(); closeModal(); toast('Ogłoszenie opublikowane'); rerender(); },
  annDel(el) { D.ann = D.ann.filter(a => a.id !== el.dataset.v); save(); toast('Ogłoszenie usunięte'); rerender(); },
  stuCard(el) { stuCard(el.dataset.v); },
  goClass(el) { U.kCls = el.dataset.v; },
  reset() { if (!confirm('Przywrócić dane demonstracyjne? Twoje zmiany zostaną usunięte.')) return; D = gen(); save(); closeModal(); toast('Dane przywrócone'); rerender(); },
};
function updCnt() { const st = studentsOf(tLessonsOn(S.id, U.dDate).find(l => l.key === U.dKey).cls), c = { ob: 0, nb: 0, u: 0, sp: 0, zw: 0 }; st.forEach(s => c[U.draft.a[s.id] || 'ob']++); $('#dCnt').innerHTML = Object.entries(c).map(([k, v]) => `<span class="att a-${k}" title="${ATT[k][0]}">${k} ${v}</span>`).join(''); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!e.target.closest('#pop,#dd,[data-a=cell],[data-a=notif]')) closePop();
  if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', e => {
  const k = e.target.dataset.on; if (k) { U[k] = e.target.value; rerender(); return; }
  if (e.target.id === 'dDate' && e.target.value) { U.dDate = e.target.value; U.dKey = null; U.draft = null; rerender(); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && S) { e.preventDefault(); palette(); }
  if (e.key === 'Escape') { if ($('.pal')) $('.pal').remove(); else if ($('#pop,#dd')) closePop(); else closeModal(); }
});

/* paleta poleceń */
function palette() {
  if ($('.pal')) return; closePop();
  const items = pagesFor(S.role).map(p => ({ t: PAGES[p][0], i: PAGES[p][1], s: 'Strona', go: () => go(p) }));
  if (S.role === 'nauczyciel' || S.role === 'dyrektor') {
    const cl = S.role === 'dyrektor' ? D.classes.map(c => c.id) : tClasses(S.id);
    D.students.filter(s => cl.includes(s.cls)).forEach(s => items.push({ t: `${s.first} ${s.last}`, i: 'users', s: `Uczeń · ${s.cls}`, go: () => stuCard(s.id) }));
    D.teachers.forEach(t => items.push({ t: `${t.first} ${t.last}`, i: 'brief', s: 'Nauczyciel · napisz', go: () => composeModal(t.id) }));
  }
  items.push({ t: 'Napisz wiadomość', i: 'edit', s: 'Akcja', go: () => composeModal() });
  items.push({ t: 'Zmień motyw', i: 'moon', s: 'Akcja', go: () => A.theme() });
  items.push({ t: 'Przywróć dane demo', i: 'refresh', s: 'Akcja', go: () => A.reset() });
  items.push({ t: 'Wyloguj', i: 'out', s: 'Akcja', go: () => A.logout() });
  const o = document.createElement('div'); o.className = 'pal';
  o.innerHTML = `<div class="bx" role="dialog" aria-label="Szukaj"><input placeholder="Szukaj stron, uczniów, akcji…" aria-label="Szukaj"><div class="rs"></div></div>`;
  document.body.appendChild(o);
  const inp = $('input', o), rs = $('.rs', o); let sel = 0, cur = [];
  const draw = () => { const q = inp.value.trim().toLowerCase(); cur = items.filter(x => !q || (x.t + ' ' + x.s).toLowerCase().includes(q)).slice(0, 40); sel = clamp(sel, 0, cur.length - 1); rs.innerHTML = cur.map((x, i) => `<button class="r${i === sel ? ' on' : ''}" data-i="${i}">${ic(x.i)}${esc(x.t)}<small>${esc(x.s)}</small></button>`).join('') || '<div class="empty">Brak wyników</div>'; };
  const run = i => { const x = cur[i]; o.remove(); if (x) x.go(); };
  inp.addEventListener('input', () => { sel = 0; draw(); });
  inp.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, cur.length - 1); draw(); e.preventDefault(); } if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); } if (e.key === 'Enter') run(sel); });
  rs.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) run(+b.dataset.i); });
  o.addEventListener('mousedown', e => { if (e.target === o) o.remove(); });
  draw(); inp.focus();
}

load(); render();
})();
</script>
</body>
