<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fuzir Studio</title>
<meta name="description" content="Fuzir Studio: projekty, zlecenia, klienci i płatności Fuzir.tech w jednej aplikacji.">
<meta name="theme-color" content="#0b0d22">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuzir">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0d22;--bg2:#10122b;--sf:rgba(255,255,255,.045);--sf2:rgba(255,255,255,.08);--card:#14163a;
  --ink:#f6f1ea;--mute:rgba(246,241,234,.62);--dim:rgba(246,241,234,.38);
  --line:rgba(246,241,234,.1);--line2:rgba(246,241,234,.2);
  --sun:#ffa24a;--sun2:#ff6e3a;--vio:#b78cff;--ok:#5ee6a0;--bad:#ff6b7a;--warn:#ffc561;--info:#7ab8ff;
  --grad:linear-gradient(110deg,#ffd29a,#ffa24a 40%,#ff6e3a 70%,#b78cff);
  --r:20px;--ease:cubic-bezier(.2,.8,.2,1);
  --disp:'Syne',system-ui,sans-serif;--sans:'Manrope',system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(90% 60% at 80% -10%,rgba(183,140,255,.18),transparent 60%),radial-gradient(80% 50% at 0% 110%,rgba(255,140,60,.14),transparent 60%);z-index:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:10px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:18px;height:18px}

/* logowanie */
.login{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(30px + var(--st)) 20px calc(30px + var(--sb));text-align:center}
.login .logo{width:96px;height:96px;border-radius:28px;box-shadow:0 20px 60px -10px rgba(255,140,60,.55);animation:pop .8s var(--ease) both}
.login h1{font-family:var(--disp);font-size:44px;letter-spacing:-.04em;margin:24px 0 6px;animation:up .7s .1s var(--ease) both}
.login p{color:var(--mute);max-width:340px;animation:up .7s .18s var(--ease) both}
.modes{display:grid;gap:12px;width:min(380px,100%);margin-top:34px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;padding:18px;border-radius:22px;background:var(--sf);border:1px solid var(--line);transition:.25s var(--ease);animation:up .7s var(--ease) both}
.mode:nth-child(1){animation-delay:.26s}.mode:nth-child(2){animation-delay:.34s}
.mode:hover{border-color:var(--line2);transform:translateY(-2px)}
.mode:active{transform:scale(.98)}
.mode .mi{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;flex:none}
.mode b{display:block;font-size:17px}.mode small{color:var(--mute);font-size:13px}
.login .note{margin-top:26px;font-size:12px;color:var(--dim);max-width:340px}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-10deg)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}

/* powłoka */
.app{position:relative;z-index:1;display:grid;grid-template-columns:260px 1fr;min-height:100svh}
.side{position:sticky;top:0;height:100svh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:rgba(11,13,34,.6);backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px;font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand img{width:38px;height:38px;border-radius:12px}
.brand small{display:block;font-family:var(--sans);font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.side nav a{position:relative;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;color:var(--mute);font-weight:700;font-size:14px;transition:.2s}
.side nav a:hover{background:var(--sf);color:var(--ink)}
.side nav a.on{background:var(--sf2);color:var(--ink)}
.side nav a.on .ic{color:var(--sun)}
.bd{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--sun2);color:#1a1020;font-size:11px;font-weight:800;display:grid;place-items:center}
.who{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--sf);border:1px solid var(--line)}
.who b{display:block;font-size:14px;line-height:1.2}.who small{color:var(--mute);font-size:12px}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#1a1020;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(14px + var(--st)) 28px 14px;background:rgba(11,13,34,.72);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid transparent;transition:border-color .3s}
.top.sc{border-color:var(--line)}
.top h1{font-family:var(--disp);font-size:24px;letter-spacing:-.03em;line-height:1.1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--mute);letter-spacing:0}
.back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sf);border:1px solid var(--line)}
.tpill{display:none;align-items:center;gap:8px;height:38px;padding:0 14px 0 10px;border-radius:99px;background:rgba(255,110,58,.16);border:1px solid rgba(255,110,58,.4);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.tpill.on{display:inline-flex}
.tpill i{width:10px;height:10px;border-radius:50%;background:var(--sun2);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.content{padding:8px 28px calc(110px + var(--sb));max-width:1180px;width:100%}
.pg{animation:pgin .45s var(--ease)}
@keyframes pgin{from{opacity:0;transform:translateY(14px)}}
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:calc(12px + var(--st)) 16px 12px}
  .top h1{font-size:22px}
  .content{padding:4px 16px calc(100px + var(--sb))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sb));z-index:30;height:66px;padding:6px;border-radius:24px;background:rgba(20,22,58,.86);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line2);box-shadow:0 20px 50px -10px rgba(0,0,0,.7)}
  .tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;color:var(--dim);font-size:10px;font-weight:800;letter-spacing:.02em;transition:color .25s}
  .tabbar a.on{color:var(--ink)}
  .tabbar a.on::before{content:"";position:absolute;inset:0;border-radius:18px;background:var(--sf2);animation:tabin .3s var(--ease)}
  .tabbar a.on .ic{color:var(--sun)}
  .tabbar a>*{position:relative}
  .tabbar .bd{position:absolute;top:5px;right:calc(50% - 22px);margin:0;min-width:17px;height:17px;font-size:10px}
  @keyframes tabin{from{transform:scale(.7);opacity:0}}
}

/* elementy */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.g3{grid-template-columns:1fr}}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
.card{background:linear-gradient(170deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;position:relative;overflow:hidden}
.st-in>*{animation:up .5s var(--ease) both}
.st-in>*:nth-child(2){animation-delay:.04s}.st-in>*:nth-child(3){animation-delay:.08s}.st-in>*:nth-child(4){animation-delay:.12s}.st-in>*:nth-child(5){animation-delay:.16s}.st-in>*:nth-child(6){animation-delay:.2s}.st-in>*:nth-child(n+7){animation-delay:.24s}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.ch h3 .ic{color:var(--sun);width:20px;height:20px}
.ch a,.lnk{font-size:13px;font-weight:800;color:var(--sun)}
.hero{border-radius:26px;padding:22px;background:linear-gradient(135deg,#ff9a4a,#ff6e3a 45%,#9b6cff);color:#1a1020;position:relative;overflow:hidden;box-shadow:0 24px 60px -24px rgba(255,110,58,.7)}
.hero::after{content:"";position:absolute;right:-50px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero>*{position:relative;z-index:1}
.hero small{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.hero b{display:block;font-family:var(--disp);font-size:42px;letter-spacing:-.04em;line-height:1.05;margin:6px 0 4px}
.hero .row{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap;font-weight:700}
.hero .row span{opacity:.75;font-size:12px;display:block;font-weight:800}
.stat span{font-size:12px;color:var(--mute);font-weight:700}
.stat b{display:block;font-family:var(--disp);font-size:30px;letter-spacing:-.03em;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:800;font-size:14px;background:var(--grad);color:#1a1020;transition:transform .15s var(--ease),filter .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.06)}
.btn.gh{background:var(--sf);color:var(--ink);border:1px solid var(--line2)}
.btn.ok{background:var(--ok);color:#06281a}.btn.bad{background:rgba(255,107,122,.16);color:var(--bad);border:1px solid rgba(255,107,122,.35)}
.btn.sm{height:36px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--sf);border:1px solid var(--line);transition:.15s}
.ib:active{transform:scale(.92)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:800;background:var(--sf2);color:var(--mute);white-space:nowrap}
.pill.ok{background:rgba(94,230,160,.14);color:var(--ok)}.pill.bad{background:rgba(255,107,122,.14);color:var(--bad)}.pill.warn{background:rgba(255,197,97,.14);color:var(--warn)}.pill.info{background:rgba(122,184,255,.14);color:var(--info)}.pill.sun{background:rgba(255,162,74,.16);color:var(--sun)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap;transition:.2s}
.chip.on{background:var(--grad);color:#1a1020;border-color:transparent}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--mute);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.empty{text-align:center;color:var(--dim);padding:30px 10px;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .8s var(--ease)}
.sp{flex:1}
.fl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mt{margin-top:14px}.mt2{margin-top:22px}
.mute{color:var(--mute)}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--sf);border:1px solid var(--line);gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;height:36px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:800;color:var(--mute);white-space:nowrap;transition:.2s}
.seg button.on{background:var(--sf2);color:var(--ink)}
/* projekty */
.pcard{display:block;width:100%;text-align:left;transition:transform .2s var(--ease),border-color .2s}
.pcard:hover{border-color:var(--line2)}
.pcard:active{transform:scale(.985)}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.pcard h4{font-size:17px;letter-spacing:-.01em}
.pcard .meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--sf2)}.ring .fgc{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800}
.ring.big{width:150px;height:150px}.ring.big circle{stroke-width:10}.ring.big b{font-family:var(--disp);font-size:34px}
.steps{display:flex;gap:6px}
.steps div{flex:1}
.steps i{display:block;height:6px;border-radius:99px;background:var(--sf2);transition:background .4s}
.steps .done i{background:var(--grad)}
.steps .now i{background:linear-gradient(90deg,var(--sun) 50%,var(--sf2) 50%)}
.steps small{display:block;font-size:11px;font-weight:700;color:var(--dim);margin-top:6px;text-align:center}
.steps .done small,.steps .now small{color:var(--ink)}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:800px){.kan{grid-template-columns:1fr}}
.col h5{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;margin-bottom:10px}
.task{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;border-radius:14px;background:var(--sf);border:1px solid var(--line);margin-bottom:8px;font-size:14px;font-weight:600;transition:.2s var(--ease);animation:up .35s var(--ease) both}
.task:active{transform:scale(.98)}
.task .cb{width:22px;height:22px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;transition:.2s}
.task.doing .cb{border-color:var(--sun)}
.task.done{opacity:.6}.task.done span{text-decoration:line-through}
.task.done .cb{background:var(--ok);border-color:var(--ok);color:#06281a}
.task .x{margin-left:auto;color:var(--dim);padding:2px 4px}
.addrow{display:flex;gap:8px;margin-top:6px}
.inp{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);padding:0 14px;font-size:15px;outline:0;transition:border-color .2s}
.inp:focus{border-color:var(--sun)}
textarea.inp{height:auto;padding:12px 14px;resize:vertical;min-height:90px}
select.inp{appearance:none}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:800;color:var(--mute)}
/* czat */
.chat{display:flex;flex-direction:column;gap:8px;min-height:240px;max-height:58vh;overflow-y:auto;padding:4px 2px 10px}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;font-size:14px;animation:up .3s var(--ease) both;white-space:pre-wrap;overflow-wrap:anywhere}
.msg small{display:block;font-size:10px;opacity:.6;margin-top:3px;font-weight:700}
.msg.me{align-self:flex-end;background:var(--grad);color:#1a1020;border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--sf2);border-bottom-left-radius:6px}
.composer{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
/* aktualizacje */
.feed{position:relative;padding-left:22px}
.feed::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.fi{position:relative;padding-bottom:16px}
.fi::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--sun)}
.fi b{font-size:14px}.fi small{display:block;color:var(--dim);font-size:12px;font-weight:700}
.fi p{color:var(--mute);font-size:14px;margin-top:2px}
.banner{display:flex;gap:12px;align-items:center;padding:16px;border-radius:18px;background:rgba(255,162,74,.12);border:1px solid rgba(255,162,74,.35);flex-wrap:wrap}
.banner .t{flex:1;min-width:200px}
/* wykres */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:18px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;max-width:40px;border-radius:10px 10px 4px 4px;background:var(--grad);height:var(--h);animation:grow 1s var(--ease) both;animation-delay:calc(var(--i)*.06s);position:relative}
.bars i.cur{box-shadow:0 0 24px rgba(255,140,60,.6)}
.bars i::after{content:attr(data-v);position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;font-style:normal;color:var(--mute);white-space:nowrap}
.bars small{font-size:11px;font-weight:700;color:var(--dim)}
@keyframes grow{from{height:0}}
/* timer */
.timer{display:flex;align-items:center;gap:16px}
.timer .clock{font-family:var(--disp);font-size:38px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.tbtn{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#1a1020;flex:none;box-shadow:0 10px 30px -8px rgba(255,110,58,.7);transition:transform .15s}
.tbtn:active{transform:scale(.9)}
.tbtn.stop{background:var(--bad);color:#2a0a10;box-shadow:0 10px 30px -8px rgba(255,107,122,.7)}
/* arkusz */
.ov{position:fixed;inset:0;z-index:100;background:rgba(5,6,18,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(560px,100%);max-height:92svh;overflow-y:auto;background:#15173a;border:1px solid var(--line2);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + var(--sb));animation:sheet .45s var(--ease)}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 14px}
.sheet h3{font-family:var(--disp);font-size:24px;letter-spacing:-.03em;margin-bottom:14px}
.sheet .acts{display:flex;gap:10px;margin-top:8px}
.sheet .acts .btn{flex:1}
@keyframes sheet{from{transform:translateY(100%)}}
@media (min-width:901px){.ov{align-items:center}.sheet{border-radius:28px;padding-bottom:24px;animation:mdl .4s var(--ease)}.sheet .grab{display:none}}
@keyframes mdl{from{opacity:0;transform:translateY(24px) scale(.97)}}

  return `<div class="grid st-in"><div class="hero"><small>Do zapłaty</small><b>${zl(due)}</b><div style="font-weight:700;opacity:.8">${inv.filter((i) => i.status === 'pending').length} ${plural(inv.filter((i) => i.status === 'pending').length, 'faktura', 'faktury', 'faktur')}</div></div>
  <div class="card"><div class="list">${inv.map((i) => { const [l, c] = invStatus(i); return `<div class="li"><span class="ib">${ic('file', 's')}</span><div class="t"><b>${esc(i.id)} · ${zl(i.amount)}</b><small>termin ${fD(i.due)}</small></div>${i.status === 'pending' ? `<button class="btn sm" data-a="payMark" data-v="${i.id}">Zapłaciłem</button>` : `<span class="pill ${c}">${i.status === 'sent' ? 'Czeka na potwierdzenie' : l}</span>`}</div>`; }).join('') || '<div class="empty">Brak faktur</div>'}</div></div>
  <div class="card"><div class="ch"><h3>${ic('wallet')}Dane do przelewu</h3></div><div class="kv"><span>Odbiorca</span><b>Fuzir.tech</b></div><div class="kv"><span>Tytuł</span><b>numer faktury</b></div><p class="mute mt" style="font-size:12px">Numer konta i BLIK poda Fuzir w czacie.</p></div></div>`;
}
let ORDER = { type: 'Sklep', feats: new Set(), time: 'Do miesiąca', budget: 'Nie wiem' };
function pZamow() {
  const ch = (list, key, multi) => `<div class="chips" style="flex-wrap:wrap">${list.map((v) => `<button class="chip${multi ? (ORDER[key].has(v) ? ' on' : '') : ORDER[key] === v ? ' on' : ''}" data-a="ord" data-k="${key}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
  return `<div class="grid st-in"><div class="card"><div class="field"><label>Rodzaj projektu</label>${ch(TYPES, 'type')}</div><div class="field"><label>Funkcje</label>${ch(FEATS, 'feats', true)}</div><div class="field"><label>Termin</label>${ch(TIMES, 'time')}</div><div class="field"><label>Budżet</label>${ch(BUDGETS, 'budget')}</div>
  <div class="field"><label for="odesc">Opisz pomysł</label><textarea class="inp" id="odesc" maxlength="600" placeholder="Np. nowa zakładka z opiniami klientów"></textarea></div>
  <button class="btn wide" data-a="orderSend">${ic('send', 's')}Wyślij do Fuzira</button></div></div>`;
}

/* render */
function render() {
  closeSheet();
  const root = $('#root');
  if (!MODE) { root.innerHTML = loginView(); return; }
  const r = route(), b = badges(), nav = NAV[MODE];
  const page = r.page === 'p' ? null : r.page;
  const P = { pulpit: pPulpit, zlecenia: pZlecenia, projekty: pProjekty, finanse: pFinanse, wiecej: pWiecej, klienci: pKlienci, wiadomosci: pWiadomosci, projekt: pKlientProjekt, czat: pKlientCzat, platnosci: pKlientPlatnosci, zamow: pZamow };
  const body = r.page === 'p' ? pProject(r.id) : P[page]();
  const p = r.page === 'p' ? proj(r.id) : null;
  const title = p ? `${esc(p.name)}<small>${esc(client(p.client).name)} · ${esc(p.type)}</small>` : `${TITLES[page]}<small>${MODE === 'fuzir' ? 'Fuzir Studio' : 'Montes.pl · klient'}</small>`;
  const activeTab = p ? 'projekty' : ['klienci', 'wiadomosci'].includes(page) ? 'wiecej' : page;
  const me = MODE === 'fuzir' ? ['Fuzir', 'Właściciel'] : ['Montes', 'Klient'];
  root.innerHTML = `<div class="app">
  <aside class="side"><div class="brand"><img src="icon-192.png" alt=""><div>Fuzir<small>Studio</small></div></div>
    <nav>${[...nav.filter((x) => x[0] !== 'wiecej'), ...EXTRA[MODE], ['wiecej', 'Ustawienia', 'more']].map(([k, n, i]) => `<a href="#/${k}" class="${(p && k === 'projekty') || page === k ? 'on' : ''}">${ic(i)}${n}${b[k] && k !== 'wiecej' ? `<span class="bd">${b[k]}</span>` : ''}</a>`).join('')}</nav>
    <div class="who">${avatar(me[0], MODE === 'fuzir' ? 'var(--grad)' : 'var(--vio)')}<div><b>${me[0]}</b><small>${me[1]}</small></div></div></aside>
  <div class="main"><header class="top" id="top">${p ? `<a class="back" href="#/${MODE === 'fuzir' ? 'projekty' : 'projekt'}" aria-label="Wróć">${ic('back', 's')}</a>` : ''}<h1>${title}</h1><button class="tpill${D.timer ? ' on' : ''}" data-a="timerStop" aria-label="Zatrzymaj licznik"><i></i><span class="tclock">${D.timer ? clock(Date.now() - D.timer.s) : ''}</span></button></header>
  <main class="content"><div class="pg">${body}</div></main></div>
  <nav class="tabbar" aria-label="Nawigacja">${nav.map(([k, n, i]) => `<a href="#/${k}" class="${activeTab === k ? 'on' : ''}">${ic(i)}<span>${n}</span>${b[k] ? `<span class="bd">${b[k]}</span>` : ''}</a>`).join('')}</nav></div>`;
  requestAnimationFrame(() => { $$('.fgc').forEach((c) => (c.style.strokeDashoffset = c.dataset.off)); const ch = $('#chat'); if (ch) ch.scrollTop = ch.scrollHeight; });
  const ib = $('#instBtn'); if (ib) { ib.disabled = !deferred && !isStandalone(); if (isStandalone()) ib.innerHTML = ic('check', 's') + 'Zainstalowana'; }
  document.title = `${p ? p.name : TITLES[page]} · Fuzir Studio`;
}
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
addEventListener('scroll', () => $('#top')?.classList.toggle('sc', scrollY > 6), { passive: true });
setInterval(() => { if (D.timer) $$('.tclock').forEach((e) => (e.textContent = clock(Date.now() - D.timer.s))); }, 1000);

/* akcje */
const A = {
  mode(el) { MODE = el.dataset.v; try { localStorage.setItem(KEY + '-mode', MODE); } catch {} location.hash = '#/' + NAV[MODE][0][0]; render(); },
  switch() { MODE = MODE === 'fuzir' ? 'client' : 'fuzir'; try { localStorage.setItem(KEY + '-mode', MODE); } catch {} location.hash = '#/' + NAV[MODE][0][0]; render(); toast(MODE === 'fuzir' ? 'Panel Fuzira' : 'Panel klienta', 'swap'); },
  reset() { if (!confirm('Przywrócić dane demo? Twoje zmiany zostaną usunięte.')) return; D = seed(); save(); render(); toast('Dane przywrócone', 'refresh'); },
  lf(el) { U.lf = el.dataset.v; render(); }, pf(el) { U.pf = el.dataset.v; render(); }, ff(el) { U.ff = el.dataset.v; render(); },
  ptab(el) { U.ptab = el.dataset.v; render(); },
  openChat(el) { U.ptab = 'chat'; go('p/' + el.dataset.v); },
  copy(el) { const v = el.dataset.v; (navigator.clipboard?.writeText(v) || Promise.reject()).then(() => toast('Skopiowano'), () => toast(v, 'clip')); },
  timerStart(el) { startTimer(el.dataset.v); }, timerStartSel() { const v = $('#tsel')?.value; if (v) startTimer(v); },
  timerStop() { if (!D.timer) return; const p = proj(D.timer.pid); const dur = Date.now() - D.timer.s; if (p && dur > 5000) p.time.push({ s: D.timer.s, e: Date.now() }); D.timer = null; save(); render(); toast(`Zapisano ${hm(dur)} · ${p?.name || ''}`, 'clock'); },
  taskCycle(el, e) { if (e.target.closest('.x')) return; const p = proj(el.dataset.p), t = p.tasks.find((x) => x.id === el.dataset.v); t.col = t.col === 'todo' ? 'doing' : t.col === 'doing' ? 'done' : 'todo'; save(); render(); if (t.col === 'done') toast('Zadanie gotowe'); },
  taskDel(el, e) { e.stopPropagation(); const p = proj(el.dataset.p); p.tasks = p.tasks.filter((x) => x.id !== el.dataset.v); save(); render(); },
  stageNext(el) { const p = proj(el.dataset.v); if (p.stage >= 4) { p.done = true; p.review = false; p.updates.unshift({ d: TODAY, t: 'Projekt zakończony 🎉', x: 'Dziękuję za współpracę!' }); toast('Projekt zakończony 🎉', 'star'); } else { p.stage++; p.review = false; p.updates.unshift({ d: TODAY, t: `Etap: ${STAGES[p.stage]}`, x: '' }); toast(`Etap: ${STAGES[p.stage]}`); } save(); render(); },
  askReview(el) { const p = proj(el.dataset.v); p.review = true; D.messages.push({ id: uid(), project: p.id, from: 'fuzir', text: `Etap „${STAGES[p.stage]}” gotowy do akceptacji. Zajrzyj do aplikacji 🙂`, d: TODAY, at: nowT(), read: false }); save(); render(); toast('Wysłano prośbę o akceptację', 'send'); },
  accept(el) { const p = proj(el.dataset.v); p.review = false; p.updates.unshift({ d: TODAY, t: `Klient zaakceptował etap „${STAGES[p.stage]}”`, x: '' }); D.messages.push({ id: uid(), project: p.id, from: 'client', text: `Akceptuję etap „${STAGES[p.stage]}” ✅`, d: TODAY, at: nowT(), read: false }); if (p.stage < 4) p.stage++; save(); render(); toast('Dzięki! Etap zaakceptowany', 'star'); },
  remarks() { go('czat'); setTimeout(() => $('.composer .inp')?.focus(), 300); },
  leadPaste() {
    sheet('Wklej zlecenie', `<p class="mute" style="font-size:14px;margin-bottom:12px">Klient kopiuje zlecenie z konfiguratora na fuzir.tech i wysyła Ci je na Discordzie. Wklej je tutaj, a aplikacja sama odczyta pola.</p><textarea class="inp" id="lp" rows="8" placeholder="Nowe zlecenie dla Fuzir.tech&#10;&#10;Rodzaj: Sklep&#10;Funkcje: Animacje 3D, SEO&#10;Termin: Do miesiąca&#10;Budżet: 500–1000 zł&#10;Opis: …&#10;Kontakt: …"></textarea><div id="lpPrev" class="mt"></div>`,
      `<button class="btn gh" data-a="leadClip">${ic('clip', 's')}Ze schowka</button><button class="btn" data-a="leadSave">Dodaj</button>`);
    $('#lp').addEventListener('input', previewLead);
  },
  async leadClip() { try { $('#lp').value = await navigator.clipboard.readText(); previewLead(); } catch { toast('Brak dostępu do schowka, wklej ręcznie', 'clip'); } },
  leadSave() { const l = parseLead($('#lp').value); if (!l.type && !l.desc) return toast('Nie rozpoznano zlecenia', 'x'); D.leads.unshift({ id: uid(), d: TODAY, status: 'new', ...l }); U.lf = 'new'; save(); render(); toast('Zlecenie dodane'); },
  leadReject(el) { D.leads.find((l) => l.id === el.dataset.v).status = 'rejected'; save(); render(); toast('Zlecenie odrzucone', 'x'); },
  leadAccept(el) { const l = D.leads.find((x) => x.id === el.dataset.v); projectSheet({ lead: l.id, name: `${l.type} · ${(l.contact || 'klient').split(/[ @(]/)[0]}`, type: TYPES.includes(l.type) ? l.type : 'Inne', clientName: (l.contact || 'Nowy klient').split(' (')[0], contact: l.contact, budget: { 'do 200 zł': 200, '200–500 zł': 400, '500–1000 zł': 800, '1000 zł +': 1500 }[l.budget] || 500, deadline: addD(TODAY, { 'Pilne': 7, 'Do 2 tygodni': 14, 'Do miesiąca': 30 }[l.time] || 45), feats: l.feats }); },
  projNew() { projectSheet({ name: '', type: 'Wizytówka', clientName: '', contact: '', budget: 500, deadline: addD(TODAY, 30) }); },
  projEdit(el) { const p = proj(el.dataset.v); sheet('Edytuj projekt', `<div class="field"><label for="en">Nazwa</label><input class="inp" id="en" value="${esc(p.name)}" maxlength="60"></div><div class="grid g2" style="gap:10px"><div class="field"><label for="ed">Termin</label><input class="inp" type="date" id="ed" value="${p.deadline}"></div><div class="field"><label for="eb">Budżet (zł)</label><input class="inp" type="number" id="eb" value="${p.budget}" min="0"></div></div><div class="field"><label for="ep">Link do podglądu</label><input class="inp" id="ep" value="${esc(p.preview)}" placeholder="https://"></div>`, `<button class="btn gh" data-a="projDel" data-v="${p.id}">Usuń</button><button class="btn" data-a="projEditSave" data-v="${p.id}">Zapisz</button>`); },
  projEditSave(el) { const p = proj(el.dataset.v); p.name = $('#en').value.trim() || p.name; p.deadline = $('#ed').value || p.deadline; p.budget = Math.max(0, +$('#eb').value || 0); const pv = $('#ep').value.trim(); p.preview = /^https?:\/\//.test(pv) ? pv : ''; save(); render(); toast('Zapisano'); },
  projDel(el) { if (!confirm('Usunąć projekt?')) return; D.projects = D.projects.filter((p) => p.id !== el.dataset.v); if (D.timer?.pid === el.dataset.v) D.timer = null; save(); go('projekty'); toast('Projekt usunięty', 'x'); },
  projSave(el) {
    const name = $('#pn').value.trim(), cn = $('#pc').value.trim(); if (!name || !cn) return toast('Podaj nazwę i klienta', 'x');
    let c = D.clients.find((x) => x.name.toLowerCase() === cn.toLowerCase()); if (!c) { c = { id: uid(), name: cn, company: cn, contact: $('#pk').value.trim() }; D.clients.push(c); }
    const feats = (el.dataset.feats || '').split('|').filter(Boolean);
    const p = { id: uid(), name, client: c.id, type: $('#pt').value, color: COLORS[D.projects.length % COLORS.length], stage: 0, deadline: $('#pd').value || addD(TODAY, 30), budget: Math.max(0, +$('#pb').value || 0), preview: '', created: TODAY, tasks: [{ id: uid(), t: 'Rozmowa i wycena', col: 'doing' }, ...feats.map((f) => ({ id: uid(), t: f, col: 'todo' }))], time: [], updates: [{ d: TODAY, t: 'Projekt utworzony', x: 'Zaczynamy!' }] };
    D.projects.unshift(p);
    if (el.dataset.lead) { const l = D.leads.find((x) => x.id === el.dataset.lead); if (l) l.status = 'accepted'; }
    save(); U.ptab = 'over'; go('p/' + p.id); toast('Projekt utworzony', 'star');
  },
  invNew(el) {
    const pid = el.dataset.v || '';
    sheet('Nowa faktura', `<div class="field"><label for="ip">Projekt</label><select class="inp" id="ip">${D.projects.map((p) => `<option value="${p.id}"${p.id === pid ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div><div class="grid g2" style="gap:10px"><div class="field"><label for="ia">Kwota (zł)</label><input class="inp" type="number" id="ia" min="1" value="${pid ? Math.round(proj(pid).budget / 2) : 300}"></div><div class="field"><label for="id2">Termin płatności</label><input class="inp" type="date" id="id2" value="${addD(TODAY, 7)}"></div></div>`, `<button class="btn" data-a="invSave">Wystaw</button>`);
  },
  invSave() { const a = +$('#ia').value; if (!(a > 0)) return toast('Podaj kwotę', 'x'); const id = `FV/${D.inv++}`; D.invoices.push({ id, project: $('#ip').value, amount: a, date: TODAY, due: $('#id2').value || addD(TODAY, 7), status: 'pending' }); save(); render(); toast(`Wystawiono ${id}`); },
  invOpen(el) { const i = D.invoices.find((x) => x.id === el.dataset.v), [l, c] = invStatus(i), p = proj(i.project); sheet(esc(i.id), `<div class="kv"><span>Projekt</span><b>${esc(p?.name || '—')}</b></div><div class="kv"><span>Klient</span><b>${esc(client(p?.client).name)}</b></div><div class="kv"><span>Kwota</span><b>${zl(i.amount)}</b></div><div class="kv"><span>Wystawiona</span><b>${fD(i.date)}</b></div><div class="kv"><span>Termin</span><b>${fD(i.due)}</b></div><div class="kv"><span>Status</span><b><span class="pill ${c}">${l}</span></b></div>`, i.status === 'paid' ? `<button class="btn gh" data-a="invUnpaid" data-v="${i.id}">Cofnij płatność</button>` : `<button class="btn gh" data-a="invDel" data-v="${i.id}">Usuń</button><button class="btn ok" data-a="invPaid" data-v="${i.id}">${ic('check', 's')}Opłacona</button>`); },
  invPaid(el) { D.invoices.find((x) => x.id === el.dataset.v).status = 'paid'; save(); render(); toast('Płatność zaksięgowana 💸', 'wallet'); },
  invUnpaid(el) { D.invoices.find((x) => x.id === el.dataset.v).status = 'pending'; save(); render(); },
  invDel(el) { D.invoices = D.invoices.filter((x) => x.id !== el.dataset.v); save(); render(); toast('Faktura usunięta', 'x'); },
  payMark(el) { const i = D.invoices.find((x) => x.id === el.dataset.v); i.status = 'sent'; D.messages.push({ id: uid(), project: i.project, from: 'client', text: `Zapłaciłem fakturę ${i.id} (${zl(i.amount)}).`, d: TODAY, at: nowT(), read: false }); save(); render(); toast('Fuzir dostał informację o płatności', 'send'); },
  ord(el) { const k = el.dataset.k, v = el.dataset.v; if (k === 'feats') ORDER.feats.has(v) ? ORDER.feats.delete(v) : ORDER.feats.add(v); else ORDER[k] = v; render(); },
  orderSend() { const desc = $('#odesc').value.trim(); D.leads.unshift({ id: uid(), d: TODAY, status: 'new', type: ORDER.type, feats: [...ORDER.feats], time: ORDER.time, budget: ORDER.budget, desc, contact: `${client(CLIENT).name} (klient)` }); ORDER = { type: 'Sklep', feats: new Set(), time: 'Do miesiąca', budget: 'Nie wiem' }; save(); render(); toast('Zlecenie wysłane do Fuzira 🚀', 'send'); },
  install() { if (deferred) { deferred.prompt(); deferred.userChoice.finally(() => { deferred = null; render(); }); } },
};
function startTimer(pid) { if (D.timer) A.timerStop(); D.timer = { pid, s: Date.now() }; save(); render(); toast(`Start: ${proj(pid).name}`, 'play'); }
function projectSheet(o) {
  sheet(o.lead ? 'Przyjmij zlecenie' : 'Nowy projekt', `<div class="field"><label for="pn">Nazwa projektu</label><input class="inp" id="pn" value="${esc(o.name)}" maxlength="60"></div>
  <div class="grid g2" style="gap:10px"><div class="field"><label for="pc">Klient</label><input class="inp" id="pc" value="${esc(o.clientName)}" maxlength="40" list="clist"><datalist id="clist">${D.clients.map((c) => `<option value="${esc(c.name)}">`).join('')}</datalist></div><div class="field"><label for="pk">Kontakt</label><input class="inp" id="pk" value="${esc(o.contact)}" maxlength="80"></div></div>
  <div class="grid g2" style="gap:10px"><div class="field"><label for="pt">Rodzaj</label><select class="inp" id="pt">${TYPES.map((t) => `<option${t === o.type ? ' selected' : ''}>${t}</option>`).join('')}</select></div><div class="field"><label for="pb">Budżet (zł)</label><input class="inp" type="number" id="pb" value="${o.budget}" min="0"></div></div>
  <div class="field"><label for="pd">Termin</label><input class="inp" type="date" id="pd" value="${o.deadline}"></div>`, `<button class="btn wide" data-a="projSave" data-lead="${o.lead || ''}" data-feats="${esc((o.feats || []).join('|'))}">${ic('check', 's')}Utwórz projekt</button>`);
}
function parseLead(txt) {
  const get = (k) => { const m = new RegExp(`^\\s*${k}\\s*:\\s*(.+)$`, 'mi').exec(txt); return m ? m[1].trim() : ''; };
  const clean = (v) => (/^\(uzupełnij\)$/i.test(v) || v === 'brak' ? '' : v);
  return { type: get('Rodzaj'), feats: clean(get('Funkcje')).split(',').map((s) => s.trim()).filter(Boolean), time: get('Termin') || 'Do ustalenia', budget: get('Budżet') || 'Nie wiem', desc: clean(get('Opis')), contact: clean(get('Kontakt')) };
}
function previewLead() { const l = parseLead($('#lp').value), el = $('#lpPrev'); if (!l.type && !l.desc) { el.innerHTML = ''; return; } el.innerHTML = `<div class="card lead"><span class="pill sun">${esc(l.type || '?')}</span> <span class="pill">${esc(l.budget)}</span><p class="mt">${esc(l.desc || '—')}</p><div class="tags">${l.feats.map((f) => `<span class="pill">${esc(f)}</span>`).join('')}</div><small class="mute">${esc(l.contact || 'brak kontaktu')}</small></div>`; }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form[data-f]'); if (!f) return; e.preventDefault();
  const p = proj(f.dataset.p), t = f.t?.value.trim();
  if (f.dataset.f === 'taskAdd') { if (!t) return; p.tasks.push({ id: uid(), t, col: 'todo' }); save(); render(); setTimeout(() => $('form[data-f=taskAdd] .inp')?.focus(), 50); }
  if (f.dataset.f === 'msgSend') {
    if (!t) return; D.messages.push({ id: uid(), project: p.id, from: MODE, text: t, d: TODAY, at: nowT(), read: false }); save(); render(); setTimeout(() => $('.composer .inp')?.focus(), 50);
    if (MODE === 'client' && !D.messages.some((m) => m.project === p.id && m.auto && m.d === TODAY)) setTimeout(() => { D.messages.push({ id: uid(), project: p.id, from: 'fuzir', text: 'Dzięki, dostałem! Odpiszę najszybciej jak się da 🙌', d: TODAY, at: nowT(), read: false, auto: true }); save(); if (route().page === 'czat') render(); }, 1800);
  }
  if (f.dataset.f === 'updAdd') { if (!t) return toast('Podaj tytuł', 'x'); p.updates.unshift({ d: TODAY, t, x: f.x.value.trim() }); save(); render(); toast('Klient zobaczy aktualizację', 'send'); }
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

/* PWA */
let deferred = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; if (route().page === 'wiecej') render(); });
addEventListener('appinstalled', () => { deferred = null; toast('Aplikacja zainstalowana 🎉', 'star'); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

render();
})();
</script>
