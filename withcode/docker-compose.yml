# Lokalnie / VPS: docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: withcode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-withcode}
      POSTGRES_DB: withcode
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U withcode -d withcode"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://withcode:${POSTGRES_PASSWORD:-withcode}@postgres:5432/withcode?schema=public
      SEED: ${SEED:-1}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_DISCORD_CLIENT_ID: ${NEXT_PUBLIC_DISCORD_CLIENT_ID:-}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://withcode:${POSTGRES_PASSWORD:-withcode}@postgres:5432/withcode?schema=public
      AUTH_TRUST_HOST: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

volumes:
  pgdata:
